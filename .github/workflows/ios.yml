name: iOS check

on:
  workflow_dispatch:

jobs:
  ios-simulator:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: hoshi-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd hoshi-frontend
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Install Tauri CLI and XcodeGen
        run: |
          npm install -g @tauri-apps/cli
          brew install xcodegen

      - name: Fetch libmpv (MPVKit)
        run: ./scripts/ios-mpv.sh

      # Rust + Swift plugins + libmpv link, without Xcode in the way.
      - name: Cargo build (simulator)
        run: cargo build -p hoshi-app --lib --target aarch64-apple-ios-sim

      - name: tauri ios init
        working-directory: hoshi-app
        run: tauri ios init --ci

      - name: tauri ios build (simulator)
        working-directory: hoshi-app
        run: tauri ios build --target aarch64-sim --debug --ci

      - name: Collect simulator app
        if: always()
        run: |
          mkdir -p out
          find hoshi-app/gen/apple/build -name "*.app" -type d -maxdepth 6 -exec cp -R {} out/ \; 2>/dev/null || true
          ls -la out

      - name: Upload simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-ios-simulator
          path: out/
          if-no-files-found: warn

      - name: Upload generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-ios-gen-apple
          path: |
            hoshi-app/gen/apple
            !hoshi-app/gen/apple/build
            !hoshi-app/gen/apple/Externals
          if-no-files-found: warn
