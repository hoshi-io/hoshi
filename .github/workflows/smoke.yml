name: Layering check

# TEMPORARY: plays a test stream on the iOS simulator, pauses it, and screenshots.
# Paused controls never auto-hide, so they must show over the video if the
# Metal layer really sits behind the webview.
on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS (simulator)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: hoshi-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd hoshi-frontend
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Install Tauri CLI and XcodeGen
        run: |
          command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
          brew install xcodegen

      - name: Fetch libmpv (MPVKit)
        run: ./scripts/ios-mpv.sh

      - name: Build (simulator)
        working-directory: hoshi-app
        run: cargo tauri ios build --target aarch64-sim --debug --ci

      - name: Run and screenshot
        run: |
          APP=$(find hoshi-app/gen/apple/build -name "*.app" -type d -maxdepth 6 | head -n1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p out
          SIMCTL_CHILD_HOSHI_SMOKE_VIDEO="https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8" \
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 40
          xcrun simctl io "$UDID" screenshot out/1-playing.png
          sleep 60
          xcrun simctl io "$UDID" screenshot out/2-paused.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layering-check
          path: out/
