name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: hoshi-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd hoshi-frontend
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

  build-desktop:
    name: Build Tauri desktop
    needs: build-frontend
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Tauri desktop
        run: tauri build --features discord-rpc

      - name: Rename Desktop Artifacts
        shell: bash
        run: |
          mkdir -p final-desktop
          VERSION=${{ github.ref_name }}
          
          # Remove AppImage
          find target/release/bundle -name "*.AppImage" -delete
          
          # Linux
          find target/release/bundle -name "*.deb" -exec mv {} final-desktop/hoshi-desktop-linux-${VERSION}.deb \;
          find target/release/bundle -name "*.rpm" -exec mv {} final-desktop/hoshi-desktop-linux-${VERSION}.rpm \;
          
          # macOS
          find target/release/bundle -name "*.dmg" -exec mv {} final-desktop/hoshi-desktop-macos-${VERSION}.dmg \;
          
          # Windows
          find target/release/bundle -name "*.msi" -exec mv {} final-desktop/hoshi-desktop-windows-${VERSION}.msi \;
          find target/release/bundle -name "*-setup.exe" -exec mv {} final-desktop/hoshi-desktop-windows-${VERSION}-setup.exe \;

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: final-desktop/*

  build-android:
    name: Build Android
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Clang, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config libssl-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK & Bindgen Variables
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13846066"
          
          NDK_PATH="$ANDROID_HOME/ndk/29.0.13846066"
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/arm-linux-androideabi" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/i686-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/x86_64-linux-android" >> $GITHUB_ENV

      - name: Build Android (split APKs)
        run: cargo tauri android build --split-per-abi

      - name: Build Android (AAB)
        run: cargo tauri android build

      - name: Sign and Rename Artifacts
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p final-artifacts
          VERSION=${{ github.ref_name }}

          echo "$KEYSTORE_B64" | base64 --decode > hoshi.jks

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)

          APK_ARM64=$(find hoshi-app/gen/android/app/build/outputs -name "*arm64*.apk" | head -n 1)
          APK_ARM32=$(find hoshi-app/gen/android/app/build/outputs -name "*app-arm-*.apk" | head -n 1)

          $BUILD_TOOLS/zipalign -v -p 4 "$APK_ARM64" final-artifacts/hoshi-android-arm64-${VERSION}.apk
          $BUILD_TOOLS/apksigner sign --ks hoshi.jks --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS final-artifacts/hoshi-android-arm64-${VERSION}.apk

          $BUILD_TOOLS/zipalign -v -p 4 "$APK_ARM32" final-artifacts/hoshi-android-arm32-${VERSION}.apk
          $BUILD_TOOLS/apksigner sign --ks hoshi.jks --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS final-artifacts/hoshi-android-arm32-${VERSION}.apk

          AAB_FILE=$(find hoshi-app/gen/android/app/build/outputs -name "*.aab" | head -n 1)

          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore hoshi.jks \
            -storepass "${KEYSTORE_PASS}" -keypass "${KEYSTORE_PASS}" \
            "$AAB_FILE" hoshi

          mv "$AAB_FILE" final-artifacts/hoshi-android-${VERSION}.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: final-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: all-artifacts
          merge-multiple: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: all-artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: all-artifacts/**/*