name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: hoshi-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd hoshi-frontend
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

  build-desktop:
    name: Build Tauri desktop
    needs: build-frontend
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com/ubuntu|archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true

          # Download package lists with timeouts
          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            update

          # Install dependencies
          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libmpv-dev

      - name: Setup mpv for Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -sL "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-11-05-3138fc8eea/mpv-dev-lgpl-x86_64-20261105-git-3138fc8eea.7z" -o mpv-dev.7z
          7z x mpv-dev.7z -oext_mpv
          mkdir -p hoshi-app/mpv-windows
          mv ext_mpv/libmpv.dll.a hoshi-app/mpv-windows/mpv.lib
          mv ext_mpv/libmpv-2.dll hoshi-app/mpv-windows/

      - name: Setup mpv for macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install mpv dylibbundler
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build Tauri desktop
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            # Stop at the .app — we patch it before it becomes a .dmg
            tauri build --features discord-rpc --bundles app
          else
            tauri build --features discord-rpc
          fi

      - name: Bundle macOS dylibs and create DMG
        if: startsWith(matrix.os, 'macos')
        run: |
          APP_PATH=$(find target/release/bundle/macos -maxdepth 1 -name "*.app")
          APP_NAME=$(basename "$APP_PATH" .app)
          
          ./scripts/macos-bundle.sh "$APP_PATH"
          
          if [ "${{ runner.arch }}" = "ARM64" ]; then echo "MAC_ARCH=arm64" >> $GITHUB_ENV
          else echo "MAC_ARCH=x64" >> $GITHUB_ENV
          fi
          
          mkdir -p target/release/bundle/dmg
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" \
            -ov -format UDZO "target/release/bundle/dmg/${APP_NAME}.dmg"

      - name: Rename Desktop Artifacts
        shell: bash
        run: |
          mkdir -p final-desktop
          VERSION=${{ github.ref_name }}
          
          find target/release/bundle -name "*.AppImage" -delete
          
          find target/release/bundle -name "*.deb" -exec mv {} final-desktop/hoshi-desktop-linux-${VERSION}.deb \;
          find target/release/bundle -name "*.rpm" -exec mv {} final-desktop/hoshi-desktop-linux-${VERSION}.rpm \;
          
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            find target/release/bundle -name "*.dmg" -exec mv {} final-desktop/hoshi-desktop-macos-${MAC_ARCH}-${VERSION}.dmg \;
          fi
          
          find target/release/bundle -name "*.msi" -exec mv {} final-desktop/hoshi-desktop-windows-${VERSION}.msi \;
          find target/release/bundle -name "*-setup.exe" -exec mv {} final-desktop/hoshi-desktop-windows-${VERSION}-setup.exe \;

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: final-desktop/*

  build-android-apk:
    name: Build Android (split APKs)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies (Clang, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config libssl-dev libclang-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android NDK & Bindgen Variables
        run: |
          # Create 'latest' symlink if it doesn't exist
          if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            LATEST_VER=$(ls "$ANDROID_HOME/cmdline-tools" | tail -n 1)
            ln -s "$ANDROID_HOME/cmdline-tools/$LATEST_VER" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | $SDKMANAGER --sdk_root=$ANDROID_HOME --install "ndk;29.0.13846066"
          
          NDK_PATH="$ANDROID_HOME/ndk/29.0.13846066"
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7-linux-androideabi --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/arm-linux-androideabi" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--target=i686-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/i686-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--target=x86_64-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/x86_64-linux-android" >> $GITHUB_ENV

      - name: Setup libmpv for Android
        run: |
          curl -sL "https://github.com/jarnedemeulemeester/libmpv-android/releases/download/v1.0.0/libmpv-release.aar" -o libmpv-release.aar
          mkdir -p ext_libmpv
          unzip -o libmpv-release.aar -d ext_libmpv
          
          mkdir -p hoshi-app/mpv-android/{arm64-v8a,armeabi-v7a,x86,x86_64}
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp ext_libmpv/jni/$abi/*.so hoshi-app/mpv-android/$abi/
            rm -f hoshi-app/mpv-android/$abi/libplayer.so
          done

      - name: Build Android (split APKs)
        run: cargo tauri android build --split-per-abi

      - name: Sign and Rename APKs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p final-apk
          VERSION=${{ github.ref_name }}
          
          echo "$KEYSTORE_B64" | base64 --decode > hoshi.jks
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          APK_ARM64=$(find hoshi-app/gen/android/app/build/outputs -name "*arm64*.apk" | head -n 1)
          APK_ARM32=$(find hoshi-app/gen/android/app/build/outputs -name "*app-arm-*.apk" | head -n 1)
          
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_ARM64" final-apk/hoshi-android-arm64-${VERSION}.apk
          $BUILD_TOOLS/apksigner sign --v4-signing-enabled false --ks hoshi.jks --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS final-apk/hoshi-android-arm64-${VERSION}.apk
          
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_ARM32" final-apk/hoshi-android-arm32-${VERSION}.apk
          $BUILD_TOOLS/apksigner sign --v4-signing-enabled false --ks hoshi.jks --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS final-apk/hoshi-android-arm32-${VERSION}.apk

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: final-apk/*

  build-android-aab:
    name: Build Android (AAB)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies (Clang, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config libssl-dev libclang-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android NDK & Bindgen Variables
        run: |
          # Create 'latest' symlink if it doesn't exist
          if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            LATEST_VER=$(ls "$ANDROID_HOME/cmdline-tools" | tail -n 1)
            ln -s "$ANDROID_HOME/cmdline-tools/$LATEST_VER" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | $SDKMANAGER --sdk_root=$ANDROID_HOME --install "ndk;29.0.13846066"

          NDK_PATH="$ANDROID_HOME/ndk/29.0.13846066"
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_SYSROOT=$SYSROOT" >> $GITHUB_ENV

          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/aarch64-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7-linux-androideabi --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/arm-linux-androideabi" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--target=i686-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/i686-linux-android" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--target=x86_64-linux-android --sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/x86_64-linux-android" >> $GITHUB_ENV

      - name: Setup libmpv for Android
        run: |
          curl -sL "https://github.com/jarnedemeulemeester/libmpv-android/releases/download/v1.0.0/libmpv-release.aar" -o libmpv-release.aar
          mkdir -p ext_libmpv
          unzip -o libmpv-release.aar -d ext_libmpv

          mkdir -p hoshi-app/mpv-android/{arm64-v8a,armeabi-v7a,x86,x86_64}
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp ext_libmpv/jni/$abi/*.so hoshi-app/mpv-android/$abi/
            rm -f hoshi-app/mpv-android/$abi/libplayer.so
          done

      - name: Build Android (AAB)
        run: cargo tauri android build

      - name: Sign and Rename AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p final-aab
          VERSION=${{ github.ref_name }}

          echo "$KEYSTORE_B64" | base64 --decode > hoshi.jks

          AAB_FILE=$(find hoshi-app/gen/android/app/build/outputs -name "*.aab" | head -n 1)

          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore hoshi.jks \
            -storepass "${KEYSTORE_PASS}" -keypass "${KEYSTORE_PASS}" \
            "$AAB_FILE" hoshi

          mv "$AAB_FILE" final-aab/hoshi-android-${VERSION}.aab

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: final-aab/*

  build-ios:
    name: Build iOS (unsigned IPA)
    needs: build-frontend
    runs-on: macos-15
    # Not tested end to end yet; a failure here must not block the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: hoshi-frontend/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-release

      # The cargo CLI, not the npm one: the Xcode build phase calls `cargo tauri ios xcode-script`.
      - name: Install Tauri CLI and XcodeGen
        run: |
          command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
          brew install xcodegen

      - name: Fetch libmpv (MPVKit)
        run: ./scripts/ios-mpv.sh

      # Sideload-only build: no team, no certificate. Sideload tools re-sign with the user's Apple ID.
      - name: Disable code signing
        working-directory: hoshi-app/gen/apple
        run: |
          python3 -c 'import pathlib; p = pathlib.Path("project.yml"); s = p.read_text(); k = "        ENABLE_BITCODE: false\n"; assert k in s; p.write_text(s.replace(k, k + "        CODE_SIGNING_ALLOWED: NO\n        CODE_SIGNING_REQUIRED: NO\n        CODE_SIGN_IDENTITY: \"\"\n", 1))'
          grep -q "CODE_SIGNING_ALLOWED: NO" project.yml
          xcodegen generate --spec project.yml

      # The archive step works unsigned; the signed export after it can't, so it's allowed to fail.
      - name: Build archive
        working-directory: hoshi-app
        run: cargo tauri ios build --target aarch64 --ci || echo "export failed (expected without signing)"

      - name: Package IPA
        run: |
          APP=$(find hoshi-app/gen/apple/build -path "*.xcarchive/Products/Applications/*.app" -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "no archived .app found"; find hoshi-app/gen/apple/build -maxdepth 3; exit 1
          fi
          mkdir -p ipa/Payload final-ipa
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../final-ipa/hoshi-ios-${{ github.ref_name }}.ipa" Payload)
          ls -la final-ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: final-ipa/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android-apk, build-android-aab, build-ios]
    # build-ios is continue-on-error, so this still runs if it failed.
    if: ${{ !cancelled() && needs.build-desktop.result == 'success' && needs.build-android-apk.result == 'success' && needs.build-android-aab.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: all-artifacts
          merge-multiple: true

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: all-artifacts

      - name: Download Android AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: all-artifacts

      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: all-artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: all-artifacts/**/*