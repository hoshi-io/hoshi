[package]
name = "hoshi-core"
version = "1.3.0"
edition = "2024"

[features]
discord-rpc = ["dep:discord-rich-presence"]

[dependencies]
discord-rich-presence = { version = "1.1.0", optional = true }

libmpv2 = "7.0.1"

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs"] }
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
bcrypt = "0.19"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5.8"
thiserror = "2.0.18"
async-trait = "0.1.89"
base64 = "0.22.1"
scraper = "0.29.0"
libc = "0.2.182"
tracing-subscriber = "0.3.23"

# crypto
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"

librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
fs2 = "0.4.3"
dashmap = "6.2.1"
lru = "0.19.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

# rquickjs ships no pregenerated bindings for android/ios
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14.0", features = ["futures", "bindgen"] }
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libmpv2-sys = "4.0.1"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["futures"] }

[target.'cfg(target_pointer_width = "32")'.dependencies]
libmpv2-sys = { version = "4.0.1", features = ["use-bindgen"] }
