[package]
name = "hoshi-core"
version = "1.0.1"
edition = "2024"

[features]
discord-rpc = ["dep:discord-rich-presence"]

[dependencies]
discord-rich-presence = { version = "1.1.0", optional = true }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "process", "fs"] }
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
bcrypt = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.11.0"
url = "2.5.8"
thiserror = "2.0.18"
async-trait = "0.1.89"
base64 = "0.22.1"
scraper = "0.25.0"
libc = "0.2.182"
urlencoding = "2.1.3"
tracing-subscriber = "0.3.23"
async-recursion = "1.1.1"

# crypto
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"

apktojs = { git = "https://github.com/hoshi-io/apktojs.git" }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.11", features = ["loader", "classes", "properties", "futures", "bindgen"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
rquickjs = { version = "0.11", default-features = false, features = ["loader", "classes", "properties", "futures"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"