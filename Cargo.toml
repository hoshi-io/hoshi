[workspace]
members = [
    "hoshi-core",
    "hoshi-app",
]

resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# iOS fell into the Linux-only SO_BINDTODEVICE branch; drop once upstream handles ios.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }